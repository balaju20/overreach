[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "balaju20-overreach"
version = "0.1.0"
description = "在同一个输入里两两比对，检测提示词的角色越权相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "balaju20" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://balaju20.github.io"
Repository = "https://github.com/balaju20/overreach"
Issues = "https://github.com/balaju20/overreach/issues"

[project.scripts]
overreach = "overreach:main"

[tool.setuptools]
py-modules = ["overreach"]
